[project]
name = "jet"
version = "0.1.0"
description = "BOSS 岗位只读插件 + 本机判断"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pypdf>=6.19.0",
]

[project.scripts]
jet = "jet.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: live environment tests requiring external services",
]
